# Placeras i repot som .github/workflows/uppdatera-data.yml
#
# Hämtar färsk data från STUPA och committar den till repot.
# GitHub Pages publicerar sedan data/ tillsammans med index.html.

name: Uppdatera data

on:
  schedule:
    # 04:00 varje natt (UTC). Under seriehelger kan man lägga till
    # t.ex. "0 */2 * * 6,0" för uppdatering varannan timme lör–sön.
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: uppdatera-data
  cancel-in-progress: false

jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera beroenden
        run: pip install requests

      - name: Hämta från STUPA
        run: python3 scraper/hamta.py --ut data

      - name: Kontrollera att resultatet är rimligt
        # Skyddsnät: om STUPA ändrar API och vi får tillbaka nästan
        # ingenting ska vi inte skriva över fungerande data.
        run: |
          antal=$(python3 -c "import json;print(len(json.load(open('data/index.json'))['klubbar']))")
          echo "Antal klubbar: $antal"
          # Normalläget i slutet av augusti 2026 är 190 klubbar och stigande
          # allteftersom fler distrikt publicerar sitt seriespel. Höj gränsen
          # när normalläget stabiliserat sig.
          if [ "$antal" -lt 150 ]; then
            echo "::error::Bara $antal klubbar hittades — misstänkt lågt. Avbryter."
            exit 1
          fi

          # Tävlingskalendern kommer till största delen från TT-Coordinator.
          # Faller den källan bort ska vi märka det, men inte stoppa
          # publiceringen — STUPA:s data är ändå värd att uppdatera.
          tav=$(python3 -c "import json;print(len(json.load(open('data/turneringar.json'))['turneringar']))")
          echo "Antal tävlingar: $tav"
          if [ "$tav" -lt 200 ]; then
            echo "::warning::Bara $tav tävlingar — TT-Coordinator kan ha fallit bort."
          fi

      - name: Committa ändringar
        run: |
          git config user.name  "stupainte-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Inga ändringar."
          else
            git commit -m "Uppdaterad data $(date -u +%Y-%m-%d)"
            git push
          fi
